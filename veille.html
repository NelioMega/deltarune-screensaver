<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Monde Sombre</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .box {
    position: fixed; box-sizing: border-box;
    background: #000; color: #fff; border: 4px solid #fff;
    box-shadow: 0 0 0 4px #000;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    opacity: 0; transition: opacity 1.2s;
  }
  .box.cache { visibility: hidden; }
  #dlg {
    left: 50%; bottom: 6vh; transform: translateX(-50%);
    width: min(86vw, 980px); min-height: 136px; padding: 28px 32px 28px 72px;
    font-size: clamp(14px, 1.5vw, 22px); line-height: 1.9;
  }
  #dlg::before { content: "*"; position: absolute; left: 34px; top: 28px; }
  #save { padding: 20px 26px; font-size: clamp(11px, 1vw, 15px); line-height: 2.2; min-width: 420px; }
  #save .row { display: flex; justify-content: space-between; gap: 2.5em; }
  #save .time { font-size: 1.9em; line-height: 1.6; }
  #batt { display: none; align-items: center; }
  #batt .barre { flex: 1; height: 0.9em; background: #800000; margin: 0 1em; }
  #batt .barre i { display: block; height: 100%; background: #ffff00; }
  #batt.faible .barre i { background: #ff2020; animation: clignote 1s steps(2) infinite; }
  #batt.charge .barre i { background: #40ff60; }
  @keyframes clignote { 50% { opacity: 0.3; } }
  .y { color: #ffff00; }
  #fondu { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 1.2s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="save" class="box">
  <div class="row"><span>KRIS</span><span>LV 1</span><span class="time" id="clock">00:00</span></div>
  <div class="row"><span class="y" id="lieu">Monde Sombre</span><span id="date"></span></div>
  <div class="row" id="batt"><span>PV</span><span class="barre"><i id="battBarre"></i></span><span id="battTxt">--%</span></div>
</div>
<div id="dlg" class="box"><span id="txt"></span></div>
<div id="fondu"></div>

<script>
// Paramètres d'URL utiles pour tester : ?scene=combat  ?duree=60 (secondes par scène)
const params = new URLSearchParams(location.search);
const DUREE_SCENE = (+params.get('duree') || 180) * 1000;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saveEl = document.getElementById('save');
const dlgEl = document.getElementById('dlg');
const txtEl = document.getElementById('txt');
const fonduEl = document.getElementById('fondu');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const PIXEL_FONT = '8px "Press Start 2P", monospace';

// ---------- Rendu basse résolution, mis à l'échelle en pixels nets ----------
let S, W, H;
function resize() {
  S = Math.max(2, Math.round(innerHeight / 240));
  W = Math.ceil(innerWidth / S);
  H = Math.ceil(innerHeight / S);
  cv.width = W; cv.height = H;
  cv.style.width = W * S + 'px';
  cv.style.height = H * S + 'px';
  ctx.imageSmoothingEnabled = false;
  if (scene && scene.init) { scene.init(); if (tFige !== null) rechauffer(); }
}

// ---------- Sprites ----------
const SPR = {
  heart: [
    '.XXX...XXX.',
    'XXXXX.XXXXX',
    'XXXXXXXXXXX',
    'XXXXXXXXXXX',
    '.XXXXXXXXX.',
    '..XXXXXXX..',
    '...XXXXX...',
    '....XXX....',
    '.....X.....',
  ],
  spade: [
    '....X....',
    '...XXX...',
    '..XXXXX..',
    '.XXXXXXX.',
    'XXXXXXXXX',
    'XXXXXXXXX',
    '.XX.X.XX.',
    '....X....',
    '...XXX...',
  ],
  club: [
    '...XXX...',
    '..XXXXX..',
    '...XXX...',
    'XXX.X.XXX',
    'XXXXXXXXX',
    'XXX.X.XXX',
    '....X....',
    '...XXX...',
    '.........',
  ],
  diamond: [
    '....X....',
    '...XXX...',
    '..XXXXX..',
    '.XXXXXXX.',
    'XXXXXXXXX',
    '.XXXXXXX.',
    '..XXXXX..',
    '...XXX...',
    '....X....',
  ],
  suitHeart: [
    '.XX...XX.',
    'XXXX.XXXX',
    'XXXXXXXXX',
    'XXXXXXXXX',
    '.XXXXXXX.',
    '..XXXXX..',
    '...XXX...',
    '....X....',
    '.........',
  ],
  mini: [
    '.X.',
    'XXX',
    '.X.',
  ],
};
function sprite(rows, x, y, color, sc = 1) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++)
    for (let c = 0; c < rows[r].length; c++)
      if (rows[r][c] === 'X') ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
}

// ---------- Éléments communs ----------
function grid(t, cell, vx, vy, color) {
  ctx.fillStyle = color;
  const ox = ((t * vx) % cell + cell) % cell;
  const oy = ((t * vy) % cell + cell) % cell;
  for (let x = ox - cell; x < W; x += cell) ctx.fillRect(Math.round(x), 0, 1, H);
  for (let y = oy - cell; y < H; y += cell) ctx.fillRect(0, Math.round(y), W, 1);
}

// L'âme qui rebondit sur les bords, avec une traînée
const soul = { x: 40, y: 40, vx: 26, vy: 19, trail: [], tt: 0 };
function bounceSoul(t, dt) {
  soul.x += soul.vx * dt; soul.y += soul.vy * dt;
  if (soul.x < 0) { soul.x = 0; soul.vx = Math.abs(soul.vx); }
  if (soul.x > W - 11) { soul.x = W - 11; soul.vx = -Math.abs(soul.vx); }
  if (soul.y < 0) { soul.y = 0; soul.vy = Math.abs(soul.vy); }
  if (soul.y > H - 9) { soul.y = H - 9; soul.vy = -Math.abs(soul.vy); }
  soul.tt += dt;
  if (soul.tt > 0.07) { soul.tt = 0; soul.trail.push({ x: soul.x, y: soul.y }); if (soul.trail.length > 6) soul.trail.shift(); }
  soul.trail.forEach((p, i) => sprite(SPR.heart, p.x, p.y, `rgba(255,0,0,${(i + 1) / 20})`));
  sprite(SPR.heart, soul.x, soul.y + Math.sin(t * 4) * 0.8, '#ff0000');
}

// Petites étoiles qui tombent
function makeStars(density, color) {
  const mk = () => ({ x: rand(0, W), y: -5, vy: rand(4, 12), sw: rand(0.5, 1.5), ph: rand(0, 6.28), big: Math.random() < .25 });
  const list = Array.from({ length: Math.ceil(W * H / density) }, mk);
  list.forEach(s => s.y = rand(0, H));
  return (t, dt) => {
    for (const s of list) {
      s.y += s.vy * dt;
      s.x += Math.sin(t * s.sw + s.ph) * 6 * dt;
      if (s.y > H + 5) Object.assign(s, mk());
      ctx.fillStyle = color(0.45 + 0.55 * Math.abs(Math.sin(t * 2 + s.ph)));
      const x = Math.round(s.x), y = Math.round(s.y);
      ctx.fillRect(x, y - 1, 1, 3); ctx.fillRect(x - 1, y, 3, 1);
      if (s.big) { ctx.fillRect(x, y - 2, 1, 5); ctx.fillRect(x - 2, y, 5, 1); }
    }
  };
}

// Point de sauvegarde (étoile jaune qui tourne) à côté de la boîte de sauvegarde
function savePoint(t) {
  if (saveEl.classList.contains('cache')) return;
  const op = parseFloat(getComputedStyle(saveEl).opacity);
  if (op <= 0.01) return;
  const r = saveEl.getBoundingClientRect();
  let x = r.left / S - 14;
  if (x < 8) x = r.right / S + 14;
  const y = Math.round((r.top + r.height / 2) / S);
  x = Math.round(x);
  const R = 5, h = Math.max(1, Math.round(R * Math.abs(Math.cos(t * 3))));
  ctx.globalAlpha = op;
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(x, y - R, 1, 2 * R + 1);
  ctx.fillRect(x - h, y, 2 * h + 1, 1);
  ctx.fillRect(x - 1, y - 1, 3, 3);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, 1, 1);
  ctx.globalAlpha = 1;
}

// =====================================================================
//  SCÈNES
// =====================================================================
const SCENES = {};

// ---------- 1. La fontaine de ténèbres ----------
SCENES.fontaine = {
  lieu: 'Fontaine Sombre',
  lines: [
    "Une fontaine de ténèbres jaillit au milieu de ton écran. C'est normal. Probablement.",
    "La fontaine murmure quelque chose. Ça ressemble à « mets à jour tes pilotes ».",
  ],
  init() {
    this.wisps = Array.from({ length: Math.ceil(H / 5) }, () => ({
      y: rand(0, H), ph: rand(0, 6.28), w: rand(3, 14), sp: rand(18, 45), h: Math.random() < .3 ? 2 : 1,
    }));
    this.stars = makeStars(2600, a => `rgba(210,235,255,${a})`);
  },
  draw(t, dt) {
    const pulse = 0.35 + Math.sin(t * 0.8) * 0.12;
    grid(t, 40, 9, 9, `rgba(150,40,170,${pulse})`);
    grid(t + 13, 40, -6, 11, `rgba(90,20,130,${pulse * 0.9})`);
    const cx = W / 2, fw = 30;
    const g = ctx.createLinearGradient(cx - 70, 0, cx + 70, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(.5, `rgba(255,255,255,${0.10 + Math.sin(t * 1.3) * 0.03})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 70, 0, 140, H);
    for (let y = 0; y < H; y++) {
      const w = fw / 2 + Math.sin(y * 0.07 - t * 3) * 2 + Math.sin(y * 0.023 + t) * 2;
      const xl = Math.round(cx - w), xr = Math.round(cx + w);
      ctx.fillStyle = '#000'; ctx.fillRect(xl, y, xr - xl, 1);
      ctx.fillStyle = '#fff'; ctx.fillRect(xl - 1, y, 1, 1); ctx.fillRect(xr, y, 1, 1);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const p of this.wisps) {
      p.y -= p.sp * dt;
      if (p.y < -4) { p.y = H + rand(0, 20); p.w = rand(3, 14); p.ph = rand(0, 6.28); }
      const room = fw / 2 - p.w / 2 - 3;
      const x = cx + Math.sin(t * 1.7 + p.ph + p.y * 0.03) * room - p.w / 2;
      ctx.fillRect(Math.round(x), Math.round(p.y), Math.round(p.w), p.h);
    }
    this.stars(t, dt);
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// ---------- 2. Combat : l'âme esquive toute seule dans la boîte ----------
SCENES.combat = {
  lieu: 'En combat',
  noSave: true,
  lines: [
    "Un ennemi sauvage apparaît ! Il a l'air... endormi.",
    "Ton âme esquive toute seule. Elle a de l'entraînement.",
    "Tu tentes de PARLER au fond d'écran. Il ne répond pas.",
    "L'équipe se tient prête. Personne ne sait contre quoi.",
  ],
  init() {
    this.bw = this.bh = Math.round(Math.min(120, H * 0.42));
    this.bx = Math.round((W - this.bw) / 2);
    this.by = Math.round((H - this.bh) / 2 + 6);
    this.s = { x: this.bx + this.bw / 2, y: this.by + this.bh / 2, vx: 0, vy: 0, inv: 0 };
    this.bullets = []; this.popups = []; this.spawn = 0; this.tp = 0;
    this.party = [
      { name: 'KRIS', color: '#00c8ff', hp: 90, max: 90 },
      { name: 'SUSIE', color: '#ff40c0', hp: 110, max: 110 },
      { name: 'RALSEI', color: '#40ff60', hp: 70, max: 70 },
    ];
  },
  draw(t, dt) {
    const { bx, by, bw, bh, s } = this;
    grid(t, 40, 9, 9, 'rgba(150,40,170,0.35)');
    grid(t + 13, 40, -6, 11, 'rgba(90,20,130,0.3)');

    // Motifs d'attaque qui changent toutes les 6 secondes
    const motif = Math.floor(t / 6) % 3;
    this.spawn -= dt;
    if (this.spawn <= 0) {
      if (motif === 0) {           // pluie de diamants
        this.bullets.push({ x: bx + rand(0, bw), y: by - 10, vx: 0, vy: rand(45, 70), spr: SPR.diamond, c: '#ff6080' });
        this.spawn = 0.18;
      } else if (motif === 1) {    // piques sur les côtés
        const g = Math.random() < .5;
        this.bullets.push({ x: g ? bx - 10 : bx + bw, y: by + rand(0, bh), vx: g ? 55 : -55, vy: 0, spr: SPR.spade, c: '#c0c0ff' });
        this.spawn = 0.25;
      } else {                     // éventail depuis le haut
        const ox = bx + bw / 2 + Math.sin(t) * bw * 0.3;
        for (let i = -3; i <= 3; i++) {
          const a = Math.PI / 2 + i * 0.28;
          this.bullets.push({ x: ox, y: by - 6, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50, spr: SPR.mini, c: '#ffffff' });
        }
        this.spawn = 1.1;
      }
    }

    // IA de l'âme : fuit les projectiles proches, revient doucement vers le centre
    let fx = (bx + bw / 2 + Math.sin(t * 0.7) * bw * 0.25 - s.x) * 0.6;
    let fy = (by + bh / 2 + Math.cos(t * 0.9) * bh * 0.25 - s.y) * 0.6;
    for (const b of this.bullets) {
      const dx = s.x - (b.x + 4), dy = s.y - (b.y + 4), d2 = dx * dx + dy * dy;
      if (d2 < 900) { fx += dx / d2 * 2600; fy += dy / d2 * 2600; }
      if (d2 < 200 && !b.graze) { b.graze = true; this.tp = Math.min(100, this.tp + 2); }
    }
    s.vx += (fx - s.vx) * Math.min(1, dt * 6); s.vy += (fy - s.vy) * Math.min(1, dt * 6);
    const sp = Math.hypot(s.vx, s.vy), max = 75;
    if (sp > max) { s.vx *= max / sp; s.vy *= max / sp; }
    s.x = Math.max(bx + 6, Math.min(bx + bw - 6, s.x + s.vx * dt));
    s.y = Math.max(by + 5, Math.min(by + bh - 5, s.y + s.vy * dt));
    s.inv = Math.max(0, s.inv - dt);

    // Boîte de combat
    ctx.fillStyle = '#000'; ctx.fillRect(bx, by, bw, bh);
    ctx.save(); ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
    this.bullets = this.bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      const w = b.spr[0].length;
      if (!s.inv && Math.abs(b.x + w / 2 - s.x) < 4 && Math.abs(b.y + w / 2 - s.y) < 4) {
        s.inv = 1.2;
        const m = pick(this.party), dmg = Math.round(rand(6, 15));
        m.hp -= dmg;
        this.popups.push({ txt: String(dmg), x: s.x, y: s.y - 8, life: 1, c: '#ffffff' });
        if (m.hp < m.max * 0.3) {
          m.hp = m.max;
          this.popups.push({ txt: 'SOIN', x: s.x + 10, y: s.y - 18, life: 1.4, c: '#40ff60' });
        }
        return false;
      }
      sprite(b.spr, b.x, b.y, b.c);
      return b.x > bx - 20 && b.x < bx + bw + 20 && b.y < by + bh + 20 && b.y > by - 30;
    });
    if (!(s.inv > 0 && Math.floor(t * 12) % 2)) sprite(SPR.heart, s.x - 5, s.y - 4, '#ff0000');
    ctx.restore();
    ctx.fillStyle = '#00c000';
    ctx.fillRect(bx - 2, by - 2, bw + 4, 2); ctx.fillRect(bx - 2, by + bh, bw + 4, 2);
    ctx.fillRect(bx - 2, by, 2, bh); ctx.fillRect(bx + bw, by, 2, bh);

    // Jauge TP
    this.tp = Math.max(0, this.tp - dt * 1.5);
    const tx = bx - 26, th = bh;
    ctx.fillStyle = '#401000'; ctx.fillRect(tx, by, 8, th);
    ctx.fillStyle = this.tp >= 100 ? '#ffd040' : '#ff8000';
    const fh = Math.round(th * this.tp / 100); ctx.fillRect(tx, by + th - fh, 8, fh);
    ctx.font = PIXEL_FONT; ctx.fillStyle = '#ff8000'; ctx.fillText('TP', tx - 4, by - 6);

    // Panneaux de l'équipe en haut
    const pw = Math.min(110, Math.floor((W - 24) / 3)), px0 = Math.round((W - pw * 3 - 8) / 2);
    this.party.forEach((m, i) => {
      const px = px0 + i * (pw + 4), py = 6;
      ctx.fillStyle = '#000'; ctx.fillRect(px, py, pw, 26);
      ctx.fillStyle = m.color;
      ctx.fillRect(px, py, pw, 1); ctx.fillRect(px, py + 25, pw, 1);
      ctx.fillRect(px, py, 1, 26); ctx.fillRect(px + pw - 1, py, 1, 26);
      ctx.fillText(m.name, px + 5, py + 12);
      if (i === 0 && batterie) {   // la batterie du PC s'affiche sur le panneau de KRIS
        const txt = batterie.niveau + '%';
        ctx.fillStyle = batterie.niveau <= 20 ? '#ff2020' : '#ffff00';
        ctx.fillText(txt, px + pw - 5 - ctx.measureText(txt).width, py + 12);
        ctx.fillStyle = m.color;
      }
      const hw = pw - 10;
      ctx.fillStyle = '#800000'; ctx.fillRect(px + 5, py + 17, hw, 4);
      ctx.fillStyle = m.color; ctx.fillRect(px + 5, py + 17, Math.round(hw * m.hp / m.max), 4);
    });

    // Chiffres de dégâts
    this.popups = this.popups.filter(p => {
      p.life -= dt; p.y -= 12 * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
      return p.life > 0;
    });
  },
};

// ---------- 3. Le carrousel du chaos ----------
SCENES.chaos = {
  lieu: 'Ch.1 Carrousel',
  lines: [
    "Le carrousel tourne. Tu as un peu le tournis.",
    "Quelqu'un rit au loin. Ça ne présage rien de bon.",
    "LES CARTES DANSENT ! LES CARTES DANSENT !",
    "Ton écran est désormais LIBRE. Libre de faire n'importe quoi.",
  ],
  init() {
    this.img = ctx.createImageData(W, H);
    this.buf = new Uint32Array(this.img.data.buffer);
    this.ang = new Float32Array(W * H);
    this.lr = new Float32Array(W * H);
    this.fade = new Float32Array(W * H);
    const cx = W / 2, cy = H / 2, rmax = Math.hypot(cx, cy);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy) + 1;
      this.ang[i] = Math.atan2(dy, dx) / (Math.PI * 2);
      this.lr[i] = Math.log(r);
      this.fade[i] = Math.min(1, r / rmax * 1.4);
    }
    this.bullets = []; this.spawn = 0;
  },
  draw(t, dt) {
    // Spirale de fond (couleurs en ABGR little-endian)
    const { buf, ang, lr, fade } = this;
    for (let i = 0; i < buf.length; i++) {
      const k = ang[i] * 6 + lr[i] * 2.2 - t * 0.5;
      const on = (Math.floor(k * 2) & 1) === 0;
      const f = fade[i];
      const r = on ? 70 * f : 20 * f, g = on ? 10 * f : 0, b = on ? 90 * f : 30 * f;
      buf[i] = 0xff000000 | (b << 16) | (g << 8) | r;
    }
    ctx.putImageData(this.img, 0, 0);

    const cx = W / 2, cy = H / 2;
    // Balles en spirale
    this.spawn -= dt;
    if (this.spawn <= 0) {
      for (const off of [0, Math.PI]) {
        const a = t * 2.3 + off;
        this.bullets.push({ x: cx, y: cy, vx: Math.cos(a) * 45, vy: Math.sin(a) * 45 });
      }
      this.spawn = 0.12;
    }
    this.bullets = this.bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      sprite(SPR.mini, b.x - 1, b.y - 1, '#ffffff');
      return b.x > -5 && b.x < W + 5 && b.y > -5 && b.y < H + 5;
    });

    // Anneaux de cartes
    const suits = [[SPR.spade, '#b0b0ff'], [SPR.suitHeart, '#ff4070'], [SPR.club, '#b0b0ff'], [SPR.diamond, '#ff4070']];
    const R1 = Math.min(W, H) * 0.36, R2 = Math.min(W, H) * 0.18;
    for (let i = 0; i < 8; i++) {
      const a = t * 0.7 + i * Math.PI / 4;
      const [spr, c] = suits[i % 4];
      const bob = Math.sin(t * 3 + i) * 3;
      sprite(spr, cx + Math.cos(a) * R1 - 9, cy + Math.sin(a) * R1 * 0.8 - 9 + bob, c, 2);
    }
    for (let i = 0; i < 4; i++) {
      const a = -t * 1.3 + i * Math.PI / 2;
      const [spr, c] = suits[(i + 1) % 4];
      sprite(spr, cx + Math.cos(a) * R2 - 4, cy + Math.sin(a) * R2 - 4, c);
    }
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// ---------- 4. La ville néon ----------
SCENES.ville = {
  lieu: 'Ch.2 Ville Cyber',
  lines: [
    "La ville clignote. Quelqu'un a oublié d'éteindre les néons.",
    "La pluie tombe en pixels. C'est très rafraîchissant.",
    "Une pub géante te promet une affaire en [OR] pour seulement [1] clic.",
    "Les voitures roulent sans conducteur. Comme ton PC en ce moment.",
  ],
  init() {
    const P = ['#00e5ff', '#ff3df0', '#ffe14d'];
    this.layers = [
      { sp: 6, col: '#170d33', min: .30, max: .62, w: [18, 40], win: 0.10, b: [], end: 0 },
      { sp: 14, col: '#21134a', min: .40, max: .75, w: [16, 34], win: 0.22, b: [], end: 0 },
      { sp: 30, col: '#0b0819', min: .45, max: .85, w: [22, 46], win: 0.35, b: [], end: 0, neon: true },
    ];
    for (const L of this.layers) { L.end = -20; L.b = []; L.pal = P; }
    this.rain = Array.from({ length: Math.ceil(W / 4) }, () => ({ x: rand(0, W), y: rand(0, H), v: rand(120, 180) }));
    this.sky = Array.from({ length: 40 }, () => [Math.random() * W, Math.random() * H * 0.5, Math.random() * 6]);
  },
  draw(t, dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05030f'); g.addColorStop(1, '#2a0a3a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const [x, y, p] of this.sky) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.3 * Math.sin(t * 2 + p)})`;
      ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // Lune
    const mx = W * 0.8, my = H * 0.18, mr = Math.min(W, H) * 0.08;
    ctx.fillStyle = '#c8f4ff';
    for (let y = -mr; y <= mr; y++) {
      const hw = Math.round(Math.sqrt(mr * mr - y * y));
      ctx.fillRect(Math.round(mx - hw), Math.round(my + y), hw * 2, 1);
    }
    const ground = H - 14;
    for (const L of this.layers) {
      const off = t * L.sp;
      while (L.end < off + W + 50) {
        const w = Math.round(rand(...L.w));
        L.b.push({ x: L.end, w, h: Math.round(rand(L.min, L.max) * ground), seed: Math.random() * 1000, c: pick(L.pal), sign: L.neon && Math.random() < .35 });
        L.end += w + Math.round(rand(1, 6));
      }
      L.b = L.b.filter(b => b.x + b.w > off - 10);
      for (const b of L.b) {
        const x = Math.round(b.x - off), y = ground - b.h;
        ctx.fillStyle = L.col; ctx.fillRect(x, y, b.w, b.h);
        // Fenêtres
        for (let wy = y + 4; wy < ground - 4; wy += 5) for (let wx = x + 3; wx < x + b.w - 3; wx += 4) {
          const hsh = Math.abs(Math.sin(b.seed + wx * 12.99 + wy * 78.23) * 43758.5) % 1;
          let lit = hsh < L.win;
          if (hsh < 0.015) lit = Math.floor(t * 3 + b.seed) % 2 === 0;
          if (lit) { ctx.fillStyle = b.c; ctx.globalAlpha = L.win * 2.2; ctx.fillRect(wx, wy, 2, 2); ctx.globalAlpha = 1; }
        }
        // Enseigne néon qui clignote
        if (b.sign && Math.sin(t * 4 + b.seed) > -0.6) {
          ctx.fillStyle = b.c;
          const sx = x + 4, sy = y + 6, sw = Math.min(14, b.w - 8);
          ctx.fillRect(sx, sy, sw, 1); ctx.fillRect(sx, sy + 6, sw, 1);
          ctx.fillRect(sx, sy, 1, 7); ctx.fillRect(sx + sw - 1, sy, 1, 7);
          ctx.fillRect(sx + 3, sy + 3, sw - 6, 1);
        }
      }
    }
    // Route
    ctx.fillStyle = '#05040c'; ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = '#00e5ff'; ctx.fillRect(0, ground, W, 1);
    ctx.fillStyle = '#ff3df0';
    for (let x = -((t * 60) % 20); x < W; x += 20) ctx.fillRect(Math.round(x), ground + 7, 8, 1);
    // Pluie
    ctx.fillStyle = 'rgba(120,200,255,0.45)';
    for (const d of this.rain) {
      d.y += d.v * dt; d.x -= d.v * 0.3 * dt;
      if (d.y > H) { d.y = -5; d.x = rand(0, W + 40); }
      for (let k = 0; k < 4; k++) ctx.fillRect(Math.round(d.x + k * 0.3), Math.round(d.y - k), 1, 1);
    }
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// Petits outils de dessin partagés par les scènes suivantes
function disque(x, y, r, col) {
  ctx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy));
    ctx.fillRect(Math.round(x - hw), Math.round(y + dy), hw * 2, 1);
  }
}
function degrade(haut, bas, milieu) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, haut); if (milieu) g.addColorStop(0.55, milieu); g.addColorStop(1, bas);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function texteCentre(txt, x, y, col) {
  ctx.font = PIXEL_FONT; ctx.fillStyle = col;
  ctx.fillText(txt, Math.round(x - ctx.measureText(txt).width / 2), Math.round(y));
}

    // Plateau
    const { cs, ox, oy } = this;
    this.cases.forEach(([i, j], k) => {
      const x = ox + i * cs, y = oy + j * cs;
      ctx.fillStyle = P0; ctx.fillRect(x, y, cs, cs);
      ctx.fillStyle = k % 5 === 0 ? P2 : P1; ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);
      if (k % 5 === 0) sprite(SPR.mini, x + cs / 2 - 1, y + cs / 2 - 1, P0);
    });
    // Logique du dé et du pion
    this.attente -= dt;
    if (this.pos === this.cible && this.attente <= 0) {
      this.de = 1 + Math.floor(Math.random() * 6);
      this.cible = (this.pos + this.de) % this.cases.length;
      this.attente = 0.4;
    } else if (this.pos !== this.cible && this.attente <= 0) {
      this.pos = (this.pos + 1) % this.cases.length; this.saut = 1;
      this.attente = this.pos === this.cible ? 2.5 : 0.35;
    }
    this.saut = Math.max(0, this.saut - dt * 4);
    const [ci, cj] = this.cases[this.pos];
    const hop = Math.sin(this.saut * Math.PI) * 6;
    sprite(SPR.heart, ox + ci * cs + cs / 2 - 5, oy + cj * cs + cs / 2 - 6 - hop, P0);
    // Dé au centre
    const dx = Math.round(W / 2 - 9), dy = Math.round(oy + this.rows * cs / 2 - 9);
    ctx.fillStyle = P0; ctx.fillRect(dx, dy, 18, 18);
    ctx.fillStyle = P3; ctx.fillRect(dx + 1, dy + 1, 16, 16);
    const pts = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
    ctx.fillStyle = P0;
    for (const [a, b] of pts[this.de]) ctx.fillRect(dx + 3 + a * 5, dy + 3 + b * 5, 2, 2);
    savePoint(t);
  },
};

// ---------- Ch.4 : le sanctuaire ----------
SCENES.sanctuaire = {
  lieu: 'Ch.4 Sanctuaire',
  lines: [
    "La lumière traverse le vitrail. Tout est calme. Presque trop.",
    "Un orgue joue quelque part, très doucement. Ou c'est le ventilateur.",
    "Les bancs sont vides. Tu pourrais t'asseoir. Tu es déjà assis.",
  ],
  init() {
    this.motes = Array.from({ length: Math.ceil(W / 5) }, () => ({ x: rand(0, W), y: rand(0, H), v: rand(3, 9), ph: rand(0, 6.28) }));
  },
  draw(t, dt) {
    degrade('#020414', '#0a1030', '#06092a');
    const cx = W / 2, cy = H * 0.3, R = Math.min(W, H) * 0.22;
    // Rayons de lumière depuis le vitrail
    for (let k = -2; k <= 2; k++) {
      const a = k * 0.18 + Math.sin(t * 0.3) * 0.03;
      ctx.fillStyle = `rgba(160,200,255,${0.035 + 0.015 * Math.sin(t + k)})`;
      for (let y = Math.round(cy); y < H; y++) {
        const f = (y - cy), x = cx + Math.tan(a) * f, hw = 4 + f * 0.12;
        ctx.fillRect(Math.round(x - hw), y, Math.round(hw * 2), 1);
      }
    }
    // Colonnes
    for (const x of [W * 0.12, W * 0.28, W * 0.72, W * 0.88]) {
      ctx.fillStyle = '#141a3a'; ctx.fillRect(Math.round(x - 7), 0, 14, H);
      ctx.fillStyle = '#1f2850'; ctx.fillRect(Math.round(x - 7), 0, 3, H);
      ctx.fillStyle = '#0a0e24'; ctx.fillRect(Math.round(x + 5), 0, 2, H);
    }
    // Rosace qui tourne lentement
    disque(cx, cy, Math.round(R + 4), '#1a1a2a');
    const cols = ['#2a5cff', '#1ec8ff', '#ffd040', '#8040ff', '#2a5cff', '#ff4080'];
    const nb = 12, rot = t * 0.08;
    for (let anneau = 0; anneau < 3; anneau++) {
      const r1 = R * (1 - anneau * 0.3), r0 = R * (0.7 - anneau * 0.3);
      for (let i = 0; i < nb; i++) {
        const a0 = rot * (anneau % 2 ? -1 : 1) + i * 2 * Math.PI / nb;
        ctx.fillStyle = cols[(i + anneau * 2) % cols.length];
        ctx.globalAlpha = 0.75 + 0.25 * Math.sin(t * 1.5 + i + anneau);
        ctx.beginPath(); ctx.arc(cx, cy, r1, a0 + 0.04, a0 + 2 * Math.PI / nb - 0.04);
        ctx.arc(cx, cy, Math.max(0, r0), a0 + 2 * Math.PI / nb - 0.04, a0 + 0.04, true); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    disque(cx, cy, Math.round(R * 0.12), '#fff8d0');
    // Bancs
    for (let r = 0; r < 3; r++) {
      const y = Math.round(H * (0.72 + r * 0.09)), w = W * (0.28 + r * 0.04);
      ctx.fillStyle = '#05061a';
      ctx.fillRect(Math.round(W * 0.06), y, Math.round(w), 6); ctx.fillRect(Math.round(W * 0.94 - w), y, Math.round(w), 6);
      ctx.fillStyle = '#1f2850';
      ctx.fillRect(Math.round(W * 0.06), y, Math.round(w), 1); ctx.fillRect(Math.round(W * 0.94 - w), y, Math.round(w), 1);
    }
    // Poussières lumineuses
    for (const m of this.motes) {
      m.y -= m.v * dt; m.x += Math.sin(t + m.ph) * 4 * dt;
      if (m.y < -2) { m.y = H + 2; m.x = rand(0, W); }
      ctx.fillStyle = `rgba(220,235,255,${0.3 + 0.5 * Math.abs(Math.sin(t * 1.3 + m.ph))})`;
      ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
    }
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// ---------- Ch.5 : le royaume floral ----------
SCENES.jardin = {
  lieu: 'Ch.5 Royaume Floral',
  lines: [
    "Les fleurs se tournent toutes vers toi. Elles sont juste polies.",
    "Le blé ondule sur la falaise. Ça sent le pain chaud et la terre mouillée.",
    "Au loin, le château fleuri brille comme un bouquet géant.",
    "Une fleur dorée te regarde. Tu fais semblant de ne pas la voir.",
  ],
  init() {
    const couleurs = ['#ff7ab8', '#ffd23f', '#ff9f43', '#c78bff', '#ffffff', '#ff5d7a'];
    this.fleurs = [];
    for (let rang = 0; rang < 3; rang++) {
      const n = Math.ceil(W / (14 - rang * 3));
      for (let i = 0; i < n; i++) this.fleurs.push({
        x: rand(0, W), rang, h: rand(10, 22) + rang * 8, c: pick(couleurs), ph: rand(0, 6.28),
        r: 2 + rang, or: Math.random() < 0.08,
      });
    }
    this.petales = Array.from({ length: Math.ceil(W / 6) }, () => ({ x: rand(0, W), y: rand(0, H), vx: rand(-20, -8), vy: rand(4, 10), ph: rand(0, 6.28), c: pick(couleurs) }));
  },
  draw(t, dt) {
    degrade('#1a0b2e', '#3a1a3a', '#4a2050');
    // Château fleuri au loin
    const cx = W * 0.72, base = H * 0.5;
    ctx.fillStyle = '#2a1238';
    ctx.fillRect(Math.round(cx - 22), Math.round(base - 40), 44, 40);
    for (const [dx, hh] of [[-26, 55], [0, 70], [26, 55]]) {
      ctx.fillStyle = '#2a1238';
      ctx.fillRect(Math.round(cx + dx - 5), Math.round(base - hh), 10, hh);
      disque(cx + dx, base - hh, 7, '#ff7ab8');
      disque(cx + dx, base - hh, 3, '#ffd23f');
    }
    for (let k = 0; k < 6; k++) if (Math.sin(t * 2 + k * 1.7) > 0) {
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(cx - 16 + k * 6), Math.round(base - 26), 2, 3);
    }
    // Falaises avec champ de blé
    const off = t * 6;
    for (let x = 0; x < W; x++) {
      const X = x + off;
      const h = Math.round(H * 0.55 + Math.sin(X * 0.015) * 10 + Math.sin(X * 0.04) * 4);
      ctx.fillStyle = '#5a2a4a'; ctx.fillRect(x, h, 1, H - h);
      ctx.fillStyle = Math.sin(X * 0.3 + t * 2) > 0.2 ? '#e8b84a' : '#c9962f';
      ctx.fillRect(x, h - 2 + Math.round(Math.sin(X * 0.7 + t * 3)), 1, 3);
    }
    // Sol du jardin
    const gy = Math.round(H * 0.72);
    ctx.fillStyle = '#2a3a1a'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#3c5a24'; ctx.fillRect(0, gy, W, 1);
    // Fleurs qui se balancent (3 rangées, du fond vers l'avant)
    for (const f of this.fleurs) {
      const pied = gy + 4 + f.rang * 10;
      const sway = Math.sin(t * 1.4 + f.ph + f.x * 0.02) * (2 + f.rang);
      const hx = f.x + sway, hy = pied - f.h;
      ctx.fillStyle = '#4c8a2c';
      for (let y = 0; y < f.h; y++) ctx.fillRect(Math.round(f.x + sway * (y / f.h)), Math.round(pied - y), 1, 1);
      const c = f.or ? '#ffd700' : f.c, r = f.r;
      disque(hx - r, hy, r, c); disque(hx + r, hy, r, c); disque(hx, hy - r, r, c); disque(hx, hy + r, r, c);
      disque(hx, hy, Math.max(1, r - 1), f.or ? '#fff3a0' : '#ffd23f');
    }
    // Pétales dans le vent
    for (const p of this.petales) {
      p.x += p.vx * dt; p.y += (p.vy + Math.sin(t * 2 + p.ph) * 6) * dt;
      if (p.x < -3 || p.y > H) { p.x = W + rand(0, 20); p.y = rand(-10, H * 0.7); }
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
    }
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// ---------- Ch.5 : la fête du Monde Lumineux ----------
SCENES.fete = {
  lieu: 'Ch.5 Jour de Fête',
  lines: [
    "C'est jour de fête en ville ! Ton PC, lui, fait la sieste.",
    "Un feu d'artifice éclate. Tout le monde fait « ooooh ».",
    "Ça sent la barbe à papa et les beignets. Tu as un peu faim.",
    "Les lanternes se balancent doucement. Personne n'est pressé ce soir.",
  ],
  init() {
    this.fusees = []; this.etincelles = []; this.prochaine = 0.5;
    this.sky = Array.from({ length: 60 }, () => [Math.random() * W, Math.random() * H * 0.6, Math.random() * 6]);
  },
  draw(t, dt) {
    degrade('#05081f', '#2a1838', '#141a40');
    for (const [x, y, p] of this.sky) {
      ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.25 * Math.sin(t * 2 + p)})`;
      ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // Feux d'artifice
    this.prochaine -= dt;
    if (this.prochaine <= 0) {
      this.fusees.push({ x: rand(W * 0.15, W * 0.85), y: H * 0.7, vy: -rand(70, 95), c: pick(['#ff5d7a', '#ffd23f', '#5de0ff', '#a6ff5d', '#ff9ff0', '#ffffff']) });
      this.prochaine = rand(0.6, 1.8);
    }
    this.fusees = this.fusees.filter(f => {
      f.y += f.vy * dt; f.vy += 40 * dt;
      ctx.fillStyle = '#ffe9a0'; ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 2);
      if (f.vy > -10) {
        for (let i = 0; i < 28; i++) {
          const a = i / 28 * Math.PI * 2, v = rand(25, 45);
          this.etincelles.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: f.c, vie: rand(1, 1.6) });
        }
        return false;
      }
      return true;
    });
    this.etincelles = this.etincelles.filter(e => {
      e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 18 * dt; e.vx *= 0.99; e.vie -= dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, e.vie));
      ctx.fillStyle = Math.random() < 0.1 ? '#ffffff' : e.c;
      const taille = e.vie > 0.7 ? 2 : 1;
      ctx.fillRect(Math.round(e.x), Math.round(e.y), taille, taille);
      ctx.globalAlpha = 1;
      return e.vie > 0;
    });
    // Toits de la ville
    const toits = H * 0.7;
    for (let x = 0, k = 0; x < W; k++) {
      const w = 26 + Math.abs(Math.sin(k * 7.3)) * 22, h = 18 + Math.abs(Math.sin(k * 3.1)) * 26;
      ctx.fillStyle = '#0c0a1e'; ctx.fillRect(Math.round(x), Math.round(toits - h), Math.round(w), H);
      for (let i = 0; i < w / 2; i++) ctx.fillRect(Math.round(x + i), Math.round(toits - h - i * 0.5), Math.max(1, Math.round(w - i * 2)), 1);
      if (Math.sin(k * 5.7) > 0) { ctx.fillStyle = '#ffcf6a'; ctx.fillRect(Math.round(x + w / 2 - 2), Math.round(toits - h + 6), 4, 4); }
      x += w;
    }
    // Guirlandes de lanternes
    const couleurs = ['#ff5d5d', '#ffb347', '#ffe066', '#ff7ab8'];
    const fil = (x, g) => H * (0.18 + g * 0.16) + Math.sin(x / W * Math.PI * 3 + g) * 4 - Math.cos(x / W * Math.PI * 2) * 6;
    for (let g = 0; g < 2; g++) {
      ctx.fillStyle = '#3a2f58';
      for (let x = 0; x < W; x++) ctx.fillRect(x, Math.round(fil(x, g)), 1, 1);
      for (let k = 0; k < 12; k++) {
        const x = (k + 0.5 + g * 0.5) * W / 12, y = fil(x, g);
        const bal = Math.sin(t * 1.5 + k + g) * 1.5;
        ctx.fillStyle = `rgba(255,200,120,${0.08 + 0.04 * Math.sin(t * 3 + k)})`;
        ctx.fillRect(Math.round(x - 6 + bal), Math.round(y - 1), 12, 14);
        ctx.fillStyle = couleurs[(k + g) % couleurs.length]; ctx.fillRect(Math.round(x - 3 + bal), Math.round(y + 2), 6, 8);
        ctx.fillStyle = '#2a2040';
        ctx.fillRect(Math.round(x - 2 + bal), Math.round(y + 1), 4, 1); ctx.fillRect(Math.round(x - 2 + bal), Math.round(y + 10), 4, 1);
      }
    }
    // Stands de fête au premier plan
    const sy = Math.round(H * 0.82);
    ctx.fillStyle = '#100c20'; ctx.fillRect(0, sy, W, H - sy);
    for (let k = 0, x = 6; x < W; k++, x += 70) {
      ctx.fillStyle = '#1c1530'; ctx.fillRect(x, sy - 16, 46, 20);
      for (let i = 0; i < 46; i += 6) {
        ctx.fillStyle = (i / 6) % 2 ? '#ffffff' : (k % 2 ? '#ff5d7a' : '#5d9bff');
        ctx.fillRect(x + i, sy - 22, 6, 6);
      }
      ctx.fillStyle = '#ffcf6a'; ctx.fillRect(x + 8, sy - 10, 30, 2);
    }
    savePoint(t);
    bounceSoul(t, dt);
  },
};

// =====================================================================
//  Gestion des scènes
// =====================================================================
const ORDRE = Object.keys(SCENES);
let scene = null, sceneIdx = 0;
function setScene(nom) {
  sceneIdx = ORDRE.indexOf(nom);
  scene = SCENES[nom];
  scene.init();
  saveEl.classList.toggle('cache', !!scene.noSave);
  document.getElementById('lieu').textContent = scene.lieu;
}
async function changerScene() {
  fonduEl.style.opacity = 1;
  await sleep(1300);
  let suivant;
  do { suivant = pick(ORDRE); } while (ORDRE.length > 1 && suivant === ORDRE[sceneIdx]);
  setScene(suivant);
  fonduEl.style.opacity = 0;
}

resize();
setScene(ORDRE.includes(params.get('scene')) ? params.get('scene') : pick(ORDRE));
addEventListener('resize', resize);
setTimeout(() => { fonduEl.style.opacity = 0; }, 100);
setInterval(changerScene, DUREE_SCENE);

let tFige = null;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (tFige !== null) scene.draw(tFige, 0);   // mode capture : image figée
  else scene.draw(now / 1000, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Horloge façon fichier de sauvegarde (change de coin pour éviter le marquage) ----------
const pad = n => String(n).padStart(2, '0');
const hhmm = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function tick() {
  document.getElementById('clock').textContent = hhmm();
  document.getElementById('date').textContent =
    new Date().toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
tick(); setInterval(tick, 1000);

// ---------- Batterie (envoyée par veille.py, ou via l'API du navigateur si dispo) ----------
let batterie = null;
function setBatterie(niveau, enCharge) {
  batterie = { niveau: Math.round(niveau), enCharge };
  const el = document.getElementById('batt');
  el.style.display = 'flex';
  el.classList.toggle('charge', enCharge);
  el.classList.toggle('faible', !enCharge && niveau <= 20);
  document.getElementById('battBarre').style.width = batterie.niveau + '%';
  document.getElementById('battTxt').textContent = batterie.niveau + '%' + (enCharge ? '+' : '');
}
if (navigator.getBattery && !params.has('capture')) navigator.getBattery().then(b => {
  const maj = () => setBatterie(b.level * 100, b.charging);
  maj(); b.addEventListener('levelchange', maj); b.addEventListener('chargingchange', maj);
}).catch(() => {});

const corners = [
  { left: '3vw', top: '4vh' }, { right: '3vw', top: '4vh' },
  { right: '3vw', bottom: '30vh' }, { left: '3vw', bottom: '30vh' },
];
let ci = 0;
function moveSave() {
  saveEl.style.opacity = 0;
  setTimeout(() => {
    const c = corners[ci++ % corners.length];
    for (const k of ['left', 'right', 'top', 'bottom']) saveEl.style[k] = c[k] ?? 'auto';
    saveEl.style.opacity = 1;
  }, 1300);
}
moveSave(); setInterval(moveSave, 45000);

// ---------- Boîte de dialogue ----------
const LINES = [
  "Le PC se repose. Rien ne bouge... à part tout le reste.",
  "Tu sens l'ordinateur te regarder d'un air endormi.",
  "Bouge la souris pour retourner dans le Monde Lumineux.",
  "Une étoile jaune scintille. Tu as l'impression que ta session est sauvegardée.",
  "Il est {h}. Le temps passe différemment dans le Monde Sombre.",
  "(Ton âme rebondit contre les bords de l'écran. Elle a l'air de s'amuser.)",
  "Le ventilateur ronronne. Tu te sens rempli de... veille.",
  "Quelque part, quelqu'un a laissé une tasse de café refroidir.",
  "L'écran attend. L'écran a toujours attendu.",
];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let derniere = '';
async function dialogLoop() {
  await sleep(4000);
  for (;;) {
    let line;
    do { line = pick(Math.random() < .5 ? scene.lines : LINES); } while (line === derniere);
    derniere = line;
    line = line.replace('{h}', hhmm());
    txtEl.textContent = '';
    dlgEl.style.opacity = 1;
    await sleep(900);
    for (const ch of line) {
      txtEl.textContent += ch;
      await sleep('.,!?'.includes(ch) ? 220 : 38);
    }
    await sleep(6000);
    dlgEl.style.opacity = 0;
    await sleep(rand(9000, 15000));
  }
}
// Fait avancer l'animation avant de la figer (et attend un feu d'artifice dans la scène de fête)
function rechauffer() {
  let i = 0;
  for (; i < 240 || (scene.etincelles && scene.etincelles.length < 60 && i < 900); i++) scene.draw(i / 30, 1 / 30);
  tFige = i / 30;
}
// ?capture : affiche tout immédiatement, sans transitions (pour faire des captures d'écran)
if (params.has('capture')) {
  const st = document.createElement('style');
  st.textContent = '*{transition:none!important}';
  document.head.appendChild(st);
  fonduEl.style.opacity = 0;
  saveEl.style.opacity = 1;
  setBatterie(64, false);
  rechauffer();
  txtEl.textContent = scene.lines[0];
  dlgEl.style.opacity = 1;
} else {
  dialogLoop();
}
</script>
